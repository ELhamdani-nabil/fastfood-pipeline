x-spark: &spark
  build: .
  image: fastfood-spark
  networks: [bd]

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks: [bd]

  minio:
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    networks: [bd]

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 8; mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/lake; exit 0;"
    networks: [bd]

  spark-master:
    <<: *spark
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["8080:8080", "7077:7077"]

  spark-worker-1:
    <<: *spark
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g
    depends_on: [spark-master]
    ports: ["8081:8081"]

  spark-worker-2:
    <<: *spark
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g
    depends_on: [spark-master]
    ports: ["8082:8081"]

  jupyter:
    <<: *spark
    container_name: jupyter
    environment:
      HOME: /tmp
    command: jupyter lab --ip=0.0.0.0 --no-browser --ServerApp.token= --ServerApp.password= --notebook-dir=/home/spark/work
    ports: ["8888:8888", "4040:4040"]
    volumes:
      - ./notebooks:/home/spark/work
      - ./:/home/spark/project
    depends_on: [spark-master]

networks:
  bd: {}

volumes:
  minio-data: {}
